name: Pylint

on: [push, pull_request]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The code targets 3.11, which pyproject.toml states for ruff and pylint.
        # It uses "X | Y" annotations and functools.cache, so earlier versions fail.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # pylint resolves imports against installed packages. Without the project
        # requirements it reports every third-party import as an error.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Analyse the code with pylint
        run: pylint $(git ls-files '*.py')
